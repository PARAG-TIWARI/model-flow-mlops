name: ModelFlow MLOps CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "params.yaml"
      - "dvc.yaml"
      - "requirements.txt"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.8

      - name: Run Ruff Linter
        run: |
          ruff check src api tests scripts

  test-and-validate:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data & Pipeline Preparation
        run: |
          python -m scripts.run_pipeline

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest tests/ -v --tb=short --cov=src --cov=api --cov-report=term-missing

      - name: Verify Clean-Room Originality
        run: |
          python scripts/check_originality.py

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: modelflow-mlops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Production / Staging
    runs-on: ubuntu-latest
    needs: [test-and-validate, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render webhook deployment..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "No RENDER_DEPLOY_HOOK_URL configured in repository secrets. Skipping auto-deploy."
          fi
