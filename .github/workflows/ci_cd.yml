name: ModelFlow MLOps CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "params.yaml"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.8

      - name: Run Ruff Linter
        run: |
          ruff check src api tests scripts

  test-and-validate:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data & Pipeline Preparation
        run: |
          python scripts/run_pipeline.py 2>&1 | tee pipeline.log || {
            EXIT_CODE=$?
            echo "## Pipeline Failure (Exit Code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pipeline.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          }

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest tests/ -v --tb=short --cov=src --cov=api --cov-report=term-missing 2>&1 | tee pytest.log || {
            EXIT_CODE=$?
            echo "## Pytest Failure (Exit Code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          }

      - name: Verify Clean-Room Originality
        run: |
          python scripts/check_originality.py 2>&1 | tee originality.log || {
            EXIT_CODE=$?
            echo "## Originality Check Failure (Exit Code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat originality.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          }

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: modelflow-mlops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Container Ingestion & Serving
        run: |
          docker run -d --name test-api -p 8000:8000 modelflow-mlops:latest
          sleep 6
          docker logs test-api
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/health/ready
          curl -f http://localhost:8000/model
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"Yes","Dependents":"No","tenure":12,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"Yes","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":89.85,"TotalCharges":1078.20}'
          docker stop test-api

  deploy-staging:
    name: Deploy to Production / Staging
    runs-on: ubuntu-latest
    needs: [test-and-validate, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render webhook deployment..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "No RENDER_DEPLOY_HOOK_URL configured in repository secrets. Skipping auto-deploy."
          fi
