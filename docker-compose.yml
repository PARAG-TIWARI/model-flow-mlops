version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modelflow-serving-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_PATH=artifacts/models/champion_model.joblib
      - METADATA_PATH=artifacts/models/model_metadata.json
      - REFERENCE_DATA_PATH=data/processed/train.csv
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: modelflow-tracking-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=sqlite:///mlflow.db
      - DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - ./mlruns:/mlflow/artifacts
      - ./mlflow.db:/mlflow/mlflow.db
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
