stages:
  data_ingestion:
    cmd: python -m src.data.ingest
    deps:
      - src/data/ingest.py
      - params.yaml
    params:
      - data.raw_path
      - data.random_state
    outs:
      - data/raw/telco_churn_raw.csv

  data_preprocessing:
    cmd: python -m src.data.loader
    deps:
      - src/data/loader.py
      - src/data/validator.py
      - data/raw/telco_churn_raw.csv
      - params.yaml
    params:
      - data.train_split
      - data.val_split
      - data.test_split
      - data.random_state
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
      - data/reference/reference_baseline.csv

  training:
    cmd: python -m src.training.trainer
    deps:
      - src/training/trainer.py
      - src/training/pipeline.py
      - src/training/registry.py
      - src/features/preprocessor.py
      - data/processed/train.csv
      - data/processed/val.csv
      - params.yaml
    params:
      - models
      - selection
      - mlflow
    outs:
      - artifacts/models/champion_model.joblib
      - artifacts/models/model_metadata.json

  evaluation:
    cmd: python -m src.evaluation.evaluator
    deps:
      - src/evaluation/evaluator.py
      - src/evaluation/metrics.py
      - artifacts/models/champion_model.joblib
      - data/processed/test.csv
      - params.yaml
    metrics:
      - artifacts/reports/evaluation_metrics.json:
          cache: false
    plots:
      - artifacts/reports/confusion_matrix.png:
          cache: false
      - artifacts/reports/roc_curve.png:
          cache: false
      - artifacts/reports/feature_importance.png:
          cache: false

  drift_analysis:
    cmd: python -m src.monitoring.drift
    deps:
      - src/monitoring/drift.py
      - data/processed/train.csv
      - data/processed/test.csv
      - params.yaml
    outs:
      - artifacts/reports/drift_report.json:
          cache: false
